receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 2s
    limit_mib: 512
  redaction/sensitive:
    allow_all_keys: true
    redact_all_types: true
    blocked_key_patterns:
      - "(?i).*password.*"
      - "(?i).*passwd.*"
      - "(?i).*secret.*"
      - "(?i).*token.*"
      - "(?i).*api[_-]?key.*"
      - "(?i).*authorization.*"
      - "(?i).*cookie.*"
    blocked_values:
      - "(?i)(password|passwd|token|api[_-]?key|secret)=([^\\s,;]+)"
      - "\\b4[0-9]{12}(?:[0-9]{3})?\\b"
      - "\\b5[1-5][0-9]{14}\\b"
    summary: info
  resourcedetection:
    detectors: [env, system]
    override: false
  resource/splunk_context:
    attributes:
      - action: upsert
        key: deployment.environment
        value: "${env:DEPLOYMENT_ENVIRONMENT}"
      - action: upsert
        key: service.namespace
        value: redacted-telemetry
  batch: {}

exporters:
  otlphttp:
    traces_endpoint: "${env:SPLUNK_INGEST_URL}/v2/trace/otlp"
    headers:
      X-SF-Token: "${env:SPLUNK_ACCESS_TOKEN}"
  signalfx:
    access_token: "${env:SPLUNK_ACCESS_TOKEN}"
    api_url: "${env:SPLUNK_API_URL}"
    ingest_url: "${env:SPLUNK_INGEST_URL}"
    sync_host_metadata: true
  splunk_hec:
    token: "${env:SPLUNK_HEC_TOKEN}"
    endpoint: "${env:SPLUNK_HEC_URL}"
    source: otel
    sourcetype: otel
    profiling_data_enabled: false

service:
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, redaction/sensitive, resourcedetection, resource/splunk_context, batch]
      exporters: [otlphttp]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, redaction/sensitive, resourcedetection, resource/splunk_context, batch]
      exporters: [signalfx]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, redaction/sensitive, resourcedetection, resource/splunk_context, batch]
      exporters: [splunk_hec]
